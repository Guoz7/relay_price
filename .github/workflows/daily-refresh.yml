name: Daily Refresh & Deploy

on:
  schedule:
    - cron: "0 18 * * *" # 每日北京时间 02:00 自动刷新
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore rolling snapshot & run history cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/history
            data/fetch-runs
          key: snapshots-${{ github.run_id }}
          restore-keys: |
            snapshots-

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Refresh public station pricing (read-only)
        run: python tools/refresh.py fetch

      - name: Sync official model specs & pricing (models.dev + LiteLLM)
        run: python tools/model_specs.py || true

      - name: Build static site & sync README rankings
        run: python tools/build.py

      - name: Verify generated dist/
        run: python tools/verify_dist.py

      - name: Commit refreshed metadata & README rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/stations-state.json data/changes.json data/last-run.json data/intel.json data/model-specs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily price refresh & README rankings [skip ci]"
            git push
          else
            echo "No metadata or README changes to commit."
          fi

      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-price-dist
          path: dist
          retention-days: 3

      - name: Deploy dist/ to Cloudflare Pages (agentied.work)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler pages deploy dist --project-name=relay-price --branch=main --commit-dirty=true
          else
            echo "Cloudflare secrets not configured; skipping Pages deploy."
          fi

      - name: Push fresh URLs to IndexNow (Bing / cn.bing.com) & Baidu
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: python tools/push_urls.py --all --limit 50 --indexnow-limit 300 || true
